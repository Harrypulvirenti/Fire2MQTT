alias: "Fire TV — Sleep when idle on home screen"
description: "Puts the Fire TV to sleep after it has been on the home screen launcher for 15 minutes."
trigger:
  - platform: state
    entity_id: sensor.living_room_fire_tv_current_app
    to: "Fire TV"           # Adjust to your launcher's app name if different
    for:
      minutes: 15
condition:
  - condition: not
    conditions:
      - condition: state
        entity_id: media_player.living_room_fire_tv
        state: "playing"
action:
  - service: mqtt.publish
    data:
      topic: "fire2mqtt/living_room_fire_tv/cmd/power"
      payload: "sleep"
      retain: false
mode: single
